info:
  name: Get recipe
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/recipes/recipe/{{locale}}/{{recipeId}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  variables:
    - name: baseUrl
      value: https://cookidoo.com.tr/
    - name: locale
      value: tr-TR
    - name: recipeId
      value: r909950

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
