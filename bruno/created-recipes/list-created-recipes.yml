info:
  name: List Created Recipes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/created-recipes/{{locale}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Created recipes returned successfully", () => {
          expect(res.getStatus()).to.equal(200);
        });

        const body = res.getBody();

        console.log("Created recipes response:", body);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
