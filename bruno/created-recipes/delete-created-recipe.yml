info:
  name: Delete Created Recipe
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/created-recipes/{{locale}}/{{createdRecipeId}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        test("Created recipe deleted successfully", () => {
          expect(status).to.be.within(200, 299);
        });

        if (status >= 200 && status < 300) {
          console.log(`✓ Deleted recipe: ${bru.getEnvVar("createdRecipeId")}`);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true