info:
  name: Get Created Recipe
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/created-recipes/{{locale}}/{{createdRecipeId}}"
  headers:
    - name: Accept
      value: application/vnd.vorwerk.customer-recipe.full+json

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Created recipe returned successfully", () => {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
